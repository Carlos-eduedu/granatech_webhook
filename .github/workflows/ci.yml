name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: granatech_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d granatech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Instala uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Instala Python do .python-version
        run: uv python install

      - name: Sincroniza dependências
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest (SQLite + PostgreSQL)
        run: uv run pytest
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/granatech_test
