[project]
name = "granatech-webhook"
version = "0.1.0"
description = "Receptor de webhooks da Granatech (consultas e propostas) — MEX Promotora"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
granatech-webhook = "granatech_webhook:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/granatech_webhook --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/granatech_webhook"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["migrations", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
strict = true
python_version = "3.15"
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "mako.*"]
ignore_missing_imports = true
